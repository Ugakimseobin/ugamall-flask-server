<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}UGAMALL B2B{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}?v=2">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/Uga_logo1.png') }}">

  <!-- Tailwind CDN (운영 중이면 빌드 방식으로 교체 권장) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ugablue: '#4f46e5',   /* ugamall 계열 */
            ugagray: '#f8fafc'
          }
        }
      }
    }
  </script>
</head>

<body class="bg-ugagray text-gray-800">

  <!-- 상단 B2B 안내 바 -->
  <a href="https://ugamall.co.kr/">
    <div class="bg-gray-900 text-gray-100 text-xl text-center py-4">
      일반소비자는 B2C 쇼핑몰로 방문해주세요!
    </div>
  </a>

  <!-- 헤더 -->
  <header class="bg-white border-b">
    <div class="max-w-7x1 mx-auto px-6 py-4">

      <!-- 상단 유틸메뉴 -->
      <div class="flex justify-end text-sm text-gray-600 gap-4 mb-2">
        {% if current_user.is_authenticated %}
          <span>{{ current_user.name }}</span>
          <a href="/logout" class="hover:text-ugablue">로그아웃</a>
        {% else %}
          <a href="/login" class="hover:text-ugablue">로그인</a>
          <a href="/register" class="hover:text-ugablue">회원가입</a>
        {% endif %}
      </div>

      <div class="flex justify-center mb-4">
        <div class="flex items-center gap-2">
          <img src="{{ url_for('static', filename='images/Uga_logo1.png') }}" 
       alt="유가몰 로고"
       class="absolute left-[-0.3rem] top-[47%] -translate-y-1/2 w-8 md:w-9 opacity-40 pointer-events-none select-none">
          <span class="text-3xl font-bold text-ugablue">유가몰</span>
          <span class="text-sm font-semibold text-gray-500 mt-2">B2B</span>
        </div>
      </div>

    </div>
  </header>

  <!-- 메인 콘텐츠 -->
  <main class="max-w-7xl mx-auto px-6 py-10">
    {% block content %}{% endblock %}
  </main>

  <!-- 푸터 -->
  <footer class="border-t bg-white mt-20">
    <div class="max-w-7xl mx-auto px-6 py-6 text-xs text-gray-500 flex justify-between">
        <div>© UGAMALL B2B</div>
        <div>의료기관 · 기업 전용 공급몰</div>
    </div>
    </footer>

</body>
</html>
