<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}UGAMALL B2B{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}?v=2">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/Uga_logo1.png') }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/TheJamsil.css') }}">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <!-- Tailwind CDN (운영 중이면 빌드 방식으로 교체 권장) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ugablue: '#4f46e5',   /* ugamall 계열 */
            ugagray: '#f8fafc'
          }
        }
      }
    }
  </script>
</head>

<body class="bg-ugagray text-gray-800">

  <!-- 상단 B2B 안내 바 -->
  <a href="https://ugamall.co.kr/">
    <div class="bg-gray-900 text-gray-100 text-xl text-center py-4">
      일반소비자는 B2C 쇼핑몰로 방문해주세요!
    </div>
  </a>

  <!-- 헤더 -->
  <header class="bg-white border-b">

    <!-- 🔹 상단 안내 바 -->
    <div class="bg-white border-b text-gray-100 text-sm">
      <div class="max-w-7xl mx-auto px-6 py-2 flex items-center justify-between">
        

        <div class="flex items-center gap-4">
          {% if current_user.is_authenticated %}
            <span class="text-gray-300 text-xs">{{ current_user.name }}님</span>
            <a href="/logout" class="hover:underline">로그아웃</a>
          {% else %}
            <a href="/login" class="hover:underline">로그인</a>
            <a href="/register" class="hover:underline">회원가입</a>
          {% endif %}
        </div>
      </div>
    </div>

    <!-- 🔹 로고 + 검색 영역 -->
    <div class="max-w-7xl mx-auto px-6 py-6 relative">

      <!-- 로고 (가운데 고정) -->
      <div class="flex justify-center">
        <div class="flex items-center gap-2">
          <img src="{{ url_for('static', filename='images/Uga_logo1.png') }}" 
       alt="유가몰 로고">
          <span class="text-3xl font-bold text-[#383938]" 
          style="font-family: 'TheJamsil5Bold', 'Noto Sans KR', sans-serif; font-weight:700;">유가몰</span>
          <span class="text-sm font-semibold text-gray-500 mt-2">B2B</span>
        </div>
      </div>

      <!-- 검색창 (오른쪽) -->
      <form action="/search"
            method="get"
            class="absolute right-6 top-1/2 -translate-y-1/2 w-72">
        <input
          type="text"
          name="q"
          placeholder="제품명 검색"
          class="w-full border rounded-full px-4 py-2 text-sm
                focus:outline-none focus:ring-2 focus:ring-ugablue"
        >
        <button type="submit"
                class="absolute right-3 top-1/2 -translate-y-1/2
                      text-gray-400 hover:text-ugablue">
          🔍
        </button>
      </form>

    </div>

  </header>

  <!-- 메인 콘텐츠 -->
  <main class="max-w-7xl mx-auto px-6 py-10">
    {% block content %}{% endblock %}
  </main>

  <!-- 푸터 -->
  <footer class="border-t bg-white mt-20">
    <div class="max-w-7xl mx-auto px-6 py-6 text-xs text-gray-500 flex justify-between">
        <div>© UGAMALL B2B</div>
        <div>의료기관 · 기업 전용 공급몰</div>
    </div>
    </footer>

</body>
</html>
