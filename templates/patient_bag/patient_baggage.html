<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>환자 귀가케어 접수</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/TheJamsil.css') }}">
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'TheJamsil5Bold', 'Noto Sans KR', 'Pretendard', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 px-4 py-6 max-w-md mx-auto">

<div class="bg-white p-6 rounded-2xl shadow-xl">
  
  <h2 class="text-2xl font-extrabold mb-6 text-gray-900">환자 귀가케어 접수</h2>

  <form method="POST" action="/patient_payment" id="patientForm" class="space-y-6">

    <!-- 1) 이름 -->
    <div>
      <label class="text-sm font-medium text-gray-700 mb-1 block">환자 이름</label>
      <input type="text" id="name" name="name"
        class="w-full border rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-400"
        placeholder="홍길동" required>
    </div>

    <!-- 2) 서비스하는 병원 목록 -->
    <div class="section">
      <label class="text-sm font-medium text-gray-700 mb-1 block">병원명</label>

      <!-- 검색창(드롭다운 트리거) -->
      <div class="relative">
        <input 
          type="text"
          id="hospitalSearch"
          placeholder="병원명을 입력하세요"
          class="w-full px-4 py-3 border rounded-lg"
          autocomplete="off"
        >

        <!-- 드롭다운 박스 -->
        <div id="hospitalDropdown"
            class="absolute left-0 right-0 mt-1 bg-white border rounded-lg shadow max-h-56 overflow-y-auto hidden z-[9999]">
          <!-- 병원 목록이 JS로 여기에 들어감 -->
        </div>
      </div>

      <!-- 선택된 병원 저장 -->
      <input type="hidden" id="hospital" name="hospital" required>
    </div>

    <!-- 3) 병동/병실 -->
    <div>
      <label class="text-sm font-medium text-gray-700 mb-1 block">병동 · 병실</label>
      <input type="text" id="ward" name="ward"
        class="w-full border rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-400"
        placeholder="본관 5층 503호" required>
    </div>

    <!-- 4) 주소 -->
    <div>
      <label class="text-sm font-medium text-gray-700 mb-1 block">주소</label>
      <div class="flex gap-2">
        <input type="text" id="address" name="address"
          class="flex-1 border rounded-xl px-4 py-3 bg-gray-50"
          placeholder="주소 찾기를 눌러주세요" readonly required>
        <button type="button"
          class="px-4 py-2 bg-gray-200 text-gray-700 rounded-xl font-semibold"
          onclick="execDaumPostcode()">
          검색
        </button>
      </div>
      <input type="hidden" id="postcode" name="postcode">
    </div>

    <!-- 5) 상세주소 -->
    <div>
      <label class="text-sm font-medium text-gray-700 mb-1 block">상세주소</label>
      <input type="text" id="detailAddress" name="detail_address"
        class="w-full border rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-400"
        placeholder="상세주소 입력">

      <label class="flex items-center gap-2 mt-2 text-sm text-gray-600">
        <input type="checkbox" id="noDetailChk" class="w-4 h-4">
        상세주소 없음
      </label>
    </div>

    
    
    <!-- 5) 결제 방법 -->
    <div class="section relative z-0">
      <label class="font-semibold text-gray-700 block mb-2">결제 방법</label>

      <div class="space-y-3">

        <!-- 카카오페이 -->
        <label class="flex items-center gap-3 cursor-pointer p-4 border rounded-lg hover:bg-gray-50 transition">
          <input type="radio" name="payment_method" value="kakaopay" class="hidden peer">

          <!-- 원형 UI -->
          <div class="w-5 h-5 rounded-full border-2 border-gray-300 flex items-center justify-center 
                      peer-checked:border-yellow-400">
            <div class="w-2.5 h-2.5 bg-yellow-400 rounded-full hidden peer-checked:block"></div>
          </div>

          <!-- 로고 -->
          <img src="{{ url_for('static', filename='images/kakaopay_logo.png') }}" 
              alt="KakaoPay" class="h-6">

          <!-- 텍스트 -->
          <span class="font-semibold text-gray-900">카카오페이</span>
        </label>

        <!-- 카드결제 -->
        <label class="flex items-center gap-3 cursor-pointer p-4 border rounded-lg hover:bg-gray-50 transition">
          <input type="radio" name="payment_method" value="card" class="hidden peer">

          <div class="w-5 h-5 rounded-full border-2 border-gray-300 flex items-center justify-center 
                      peer-checked:border-indigo-500">
            <div class="w-2.5 h-2.5 bg-indigo-500 rounded-full hidden peer-checked:block"></div>
          </div>

          <span class="font-semibold text-gray-900">카드결제</span>
        </label>

        <!-- 계좌이체 -->
        <label class="flex items-center gap-3 cursor-pointer p-4 border rounded-lg hover:bg-gray-50 transition">
          <input type="radio" name="payment_method" value="bank_transfer" class="hidden peer">
          <div class="w-5 h-5 rounded-full border-2 border-gray-300 flex items-center justify-center peer-checked:border-gray-600">
            <div class="w-2.5 h-2.5 bg-gray-600 rounded-full hidden peer-checked:block"></div>
          </div>
          <span class="font-semibold text-gray-900">계좌이체</span>
        </label>
      </div>
    </div>

    <!-- 가격 표시 -->
    <div class="bg-indigo-50 text-indigo-700 font-bold text-center py-3 rounded-xl">
      금액: 0원
    </div>

    <button class="w-full bg-indigo-600 text-white py-4 rounded-xl font-extrabold text-lg">
      결제하기
    </button>

  </form>
</div>

<script>
function execDaumPostcode() {
  new daum.Postcode({
    oncomplete: function(data) {
      document.getElementById("postcode").value = data.zonecode;
      document.getElementById("address").value = data.roadAddress || data.jibunAddress;
    }
  }).open();
}

document.getElementById("noDetailChk").addEventListener("change", function() {
  const detail = document.getElementById("detailAddress");
  if (this.checked) {
    detail.value = "";
    detail.disabled = true;
    detail.placeholder = "상세주소 없음";
  } else {
    detail.disabled = false;
    detail.placeholder = "상세주소 입력";
  }
});
</script>

<script>
// 🔥 병원 리스트 (정렬된 상태)
const hospitals = [
    {% for h in hospitals %}
      "{{ h.name }}",
    {% endfor %}
  ].sort();

const input = document.getElementById("hospitalSearch");
const dropdown = document.getElementById("hospitalDropdown");
const hiddenInput = document.getElementById("hospital");

// 드롭다운 렌더 함수
function renderDropdown(list) {
  dropdown.innerHTML = list.length
    ? list.map(h => `
        <div class="px-4 py-2 cursor-pointer hover:bg-gray-100" data-value="${h}">
          ${h}
        </div>
      `).join("")
    : `<div class="px-4 py-2 text-gray-500">검색 결과 없음</div>`;
}

// 🔥 최초 전체 병원 목록 렌더링
renderDropdown(hospitals);

// 검색: 입력할 때 필터링
input.addEventListener("input", () => {
  const keyword = input.value.toLowerCase().trim();

  const filtered = hospitals.filter(h =>
    h.toLowerCase().includes(keyword)
  );

  renderDropdown(filtered);

  dropdown.classList.remove("hidden");
});

// input 클릭하면 드롭다운 펼치기
input.addEventListener("focus", () => {
  dropdown.classList.remove("hidden");
});

// 리스트 클릭 시 선택
dropdown.addEventListener("click", (e) => {
  const item = e.target.closest("[data-value]");
  if (!item) return;

  const selected = item.dataset.value;

  input.value = selected;   // UI 표시
  hiddenInput.value = selected; // 서버 전송 값

  dropdown.classList.add("hidden");
});

// input 밖 클릭 시 닫힘
document.addEventListener("click", (e) => {
  if (!dropdown.contains(e.target) && e.target !== input) {
    dropdown.classList.add("hidden");
  }
});

// 목록에 없는 병원도 저장되도록 처리
input.addEventListener("blur", () => {
  hiddenInput.value = input.value.trim();
});
</script>
</body>
</html>
