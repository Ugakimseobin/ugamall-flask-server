<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>환자 짐 접수</title>

  <!-- ✅ Daum 주소검색 -->
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      max-width: 480px;
      margin: 0 auto;
      background: #f5f6f8;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    h2 {
      font-weight: 800;
      font-size: 22px;
      margin-bottom: 18px;
      color: #111827;
    }

    .section {
      margin-bottom: 18px;
      display: none;
      opacity: 0;
      transform: translateY(6px);
      transition: all .25s ease;
    }
    .section.active {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    label {
      font-weight: 700;
      color: #374151;
      font-size: 14px;
      display: block;
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
      box-sizing: border-box;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
    }

    .btn {
      width: 100%;
      background: #4f46e5;
      color: white;
      padding: 16px;
      border-radius: 12px;
      font-weight: 800;
      border: none;
      font-size: 16px;
      cursor: pointer;
      display: none;
    }
    .btn:active { transform: scale(0.985); }

    .price-box {
      margin-top: 10px;
      padding: 14px;
      background: #f0f5ff;
      border-radius: 12px;
      color: #1e40af;
      font-weight: 800;
      text-align: center;
      font-size: 18px;
      display: none;
    }

    .row {
      display: flex;
      gap: 8px;
    }
    .row input[readonly] {
      background: #f9fafb;
      color: #111827;
      cursor: default;
    }
    .addr-btn {
      white-space: nowrap;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
    }
    .checkbox input {
      width: 16px;
      height: 16px;
      padding: 0;
      margin: 0;
    }

    .helper {
      font-size: 12px;
      color: #6b7280;
      margin-top: 6px;
    }

    .error {
      font-size: 12px;
      color: #dc2626;
      margin-top: 6px;
      display: none;
      font-weight: 700;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>환자 짐 접수</h2>

  <form method="POST" action="/patient_payment" id="patientForm">

    <!-- 1) 이름 (2글자 이상 입력 완료 후 다음) -->
    <div class="section active" id="sec1">
      <label>환자 이름</label>
      <input type="text" id="name" name="name" placeholder="홍길동" required>
      <div class="helper">이름은 2글자 이상 입력해 주세요.</div>
      <div class="error" id="err-name">이름을 2글자 이상 입력해 주세요.</div>
    </div>

    <!-- 2) 병동/병실 (3글자 이상 입력 완료 후 다음) -->
    <div class="section" id="sec2">
      <label>병동 · 병실</label>
      <input type="text" id="ward" name="ward" placeholder="본관 5층 503호" required>
      <div class="helper">병동/병실은 3글자 이상 입력해 주세요.</div>
      <div class="error" id="err-ward">병동/병실을 3글자 이상 입력해 주세요.</div>
    </div>

    <!-- 3) 주소 (카카오 주소 찾기 완료 후 다음) -->
    <div class="section" id="sec3">
      <label>주소</label>
      <div class="row">
        <input type="text" id="address" name="address" placeholder="주소 찾기를 눌러주세요" readonly required>
        <button type="button" class="addr-btn" onclick="execDaumPostcode()">주소 찾기</button>
      </div>
      <input type="hidden" id="postcode" name="postcode">
      <div class="error" id="err-address">주소를 선택해 주세요.</div>
    </div>

    <!-- 4) 상세주소 (입력 1자 이상 OR 상세주소 없음 체크 시 다음) -->
    <div class="section" id="sec4">
      <label>상세주소</label>
      <input type="text" id="detailAddress" name="detail_address" placeholder="상세주소 입력">
      <label class="checkbox">
        <input type="checkbox" id="noDetailChk">
        상세주소 없음
      </label>
      <div class="error" id="err-detail">상세주소 입력 또는 '상세주소 없음'을 선택해 주세요.</div>
    </div>

    <!-- 5) 배송 방식 -->
    <div class="section" id="sec5">
      <label>배송 방법</label>
      <select id="delivery_type" name="delivery_type" required>
        <option value="">선택하세요</option>
        <option value="일반배송">일반배송</option>
        <option value="특급배송">특급배송</option>
      </select>
    </div>

    <!-- 6) 크기 -->
    <div class="section" id="sec6">
      <label>짐 크기</label>
      <select id="size" name="size" required>
        <option value="">선택하세요</option>
        <option value="소형">소형</option>
        <option value="중형">중형</option>
        <option value="대형">대형</option>
      </select>
    </div>

    <!-- 7) 무게 -->
    <div class="section" id="sec7">
      <label>짐 무게</label>
      <select id="weight" name="weight" required>
        <option value="">선택하세요</option>
        <option value="가벼움">가벼움</option>
        <option value="보통">보통</option>
        <option value="무거움">무거움</option>
      </select>
    </div>

    <!-- 가격 표시 -->
    <div class="price-box" id="priceBox">총 금액: 0원</div>

    <!-- 제출 -->
    <button class="btn" id="submitBtn">결제하기</button>

  </form>
</div>

<script>
/* ===========================
   ✅ 단계 노출 유틸
=========================== */
function showSection(id) {
  const el = document.getElementById(id);
  if (!el.classList.contains("active")) {
    el.classList.add("active");
    setTimeout(() => el.scrollIntoView({ behavior:"smooth", block:"center" }), 50);
  }
}

function hideError(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = "none";
}
function showError(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = "block";
}

/* ===========================
   ✅ 1) 이름: 2글자 이상 + blur 시 다음
=========================== */
const nameInput = document.getElementById("name");
nameInput.addEventListener("input", () => hideError("err-name"));
nameInput.addEventListener("blur", () => {
  const val = nameInput.value.trim();
  if (val.length >= 2) {
    showSection("sec2");
  } else {
    showError("err-name");
  }
});

/* ===========================
   ✅ 2) 병동/병실: 3글자 이상 + blur 시 다음
=========================== */
const wardInput = document.getElementById("ward");
wardInput.addEventListener("input", () => hideError("err-ward"));
wardInput.addEventListener("blur", () => {
  const val = wardInput.value.trim();
  if (val.length >= 3) {
    showSection("sec3");
  } else {
    showError("err-ward");
  }
});

/* ===========================
   ✅ 3) 카카오 주소검색
=========================== */
function execDaumPostcode() {
  new daum.Postcode({
    oncomplete: function(data) {
      const fullAddress = data.roadAddress || data.jibunAddress;
      const postcode = data.zonecode;

      document.getElementById("postcode").value = postcode;
      document.getElementById("address").value = fullAddress;

      hideError("err-address");
      showSection("sec4");
      document.getElementById("detailAddress").focus();
    }
  }).open();
}

/* ===========================
   ✅ 4) 상세주소 (입력 1자 이상 OR 없음 체크)
=========================== */
const detailInput = document.getElementById("detailAddress");
const noDetailChk = document.getElementById("noDetailChk");

function checkDetailAndNext() {
  const detailVal = detailInput.value.trim();
  const checked = noDetailChk.checked;

  hideError("err-detail");

  if (checked) {
    showSection("sec5");
    return;
  }
  if (detailVal.length >= 1) {
    showSection("sec5");
    return;
  }
}

detailInput.addEventListener("input", () => {
  noDetailChk.checked = false; // 입력하면 체크 해제
  checkDetailAndNext();
});

detailInput.addEventListener("blur", () => {
  checkDetailAndNext();
  if (!noDetailChk.checked && detailInput.value.trim().length < 1) {
    showError("err-detail");
  }
});

noDetailChk.addEventListener("change", () => {
  if (noDetailChk.checked) {
    detailInput.value = "";
    detailInput.disabled = true;
    detailInput.placeholder = "상세주소 없음";
    hideError("err-detail");
    showSection("sec5");
  } else {
    detailInput.disabled = false;
    detailInput.placeholder = "상세주소 입력";
  }
});

/* ===========================
   ✅ 5) 배송/크기/무게 선택 후 다음
=========================== */
const deliverySel = document.getElementById("delivery_type");
const sizeSel = document.getElementById("size");
const weightSel = document.getElementById("weight");

deliverySel.addEventListener("change", () => {
  if (deliverySel.value) showSection("sec6");
  calculatePrice();
});
sizeSel.addEventListener("change", () => {
  if (sizeSel.value) showSection("sec7");
  calculatePrice();
});
weightSel.addEventListener("change", calculatePrice);

/* ===========================
   ✅ 서버 가격 계산 (/patient_price)
=========================== */
const priceBox = document.getElementById("priceBox");
const submitBtn = document.getElementById("submitBtn");

async function calculatePrice() {
  const delivery = deliverySel.value;
  const size = sizeSel.value;
  const weight = weightSel.value;

  if (!delivery || !size || !weight) {
    priceBox.style.display = "none";
    submitBtn.style.display = "none";
    return;
  }

  try {
    const res = await fetch("/patient_price", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        delivery_type: delivery,
        size: size,
        weight: weight
      })
    });

    const data = await res.json();
    const price = Number(data.price || 0);

    priceBox.textContent = "총 금액: " + price.toLocaleString() + "원";
    priceBox.style.display = "block";
    submitBtn.style.display = "block";
    submitBtn.scrollIntoView({ behavior:"smooth", block:"center" });
  } catch (e) {
    console.error(e);
    alert("가격 계산 중 오류가 발생했습니다.");
  }
}

/* ===========================
   ✅ 폼 제출 전 마지막 검증
=========================== */
document.getElementById("patientForm").addEventListener("submit", (e) => {
  const nameVal = nameInput.value.trim();
  const wardVal = wardInput.value.trim();
  const addrVal = document.getElementById("address").value.trim();

  if (nameVal.length < 2) { e.preventDefault(); showError("err-name"); nameInput.focus(); return; }
  if (wardVal.length < 3) { e.preventDefault(); showError("err-ward"); wardInput.focus(); return; }
  if (!addrVal) { e.preventDefault(); showError("err-address"); return; }

  const detailVal = detailInput.value.trim();
  if (!noDetailChk.checked && detailVal.length < 1) {
    e.preventDefault();
    showError("err-detail");
    detailInput.focus();
    return;
  }
});
</script>

</body>
</html>
