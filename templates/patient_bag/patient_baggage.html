<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>환자 귀가케어 접수</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/TheJamsil.css') }}">
  <!-- ✅ Daum 주소검색 -->
  <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
  <style>
    body {
      font-family: 'TheJamsil5Bold', 'Noto Sans KR', 'Pretendard', sans-serif;
      max-width: 480px;
      margin: 0 auto;
      background: #f5f6f8;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    h2 {
      font-weight: 900;
      font-size: 26px;
      margin-bottom: 22px;
      color: #111827;
      letter-spacing: -0.3px;
    }

    .section {
      margin-bottom: 18px;
      display: none;
      opacity: 0;
      transform: translateY(6px);
      transition: all .25s ease;
    }
    .section.active {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    label {
      font-weight: 500;
      color: #111827;
      font-size: 14px;
      display: block;
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      background: #fff;
      box-sizing: border-box;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
    }

    .btn {
      width: 100%;
      background: #4f46e5;
      color: white;
      padding: 16px;
      border-radius: 12px;
      font-weight: 800;
      border: none;
      font-size: 16px;
      cursor: pointer;
      display: none;
    }
    .btn:active { transform: scale(0.985); }

    .price-box {
      margin-top: 10px;
      padding: 14px;
      background: #f0f5ff;
      border-radius: 12px;
      color: #1e40af;
      font-weight: 800;
      text-align: center;
      font-size: 18px;
      display: none;
    }

    .row {
      display: flex;
      gap: 8px;
    }
    .row input[readonly] {
      background: #f9fafb;
      color: #111827;
      cursor: default;
    }
    .addr-btn {
      white-space: nowrap;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      background: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
    }
    .checkbox input {
      width: 16px;
      height: 16px;
      padding: 0;
      margin: 0;
    }

    .helper {
      font-size: 12px;
      color: #6b7280;
      margin-top: 6px;
    }

    .error {
      font-size: 12px;
      color: #dc2626;
      margin-top: 6px;
      display: none;
      font-weight: 700;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>환자 귀가케어 접수</h2>

  <form method="POST" action="/patient_payment" id="patientForm">

    <!-- 1) 이름 (2글자 이상 입력 완료 후 다음) -->
    <div class="section active" id="sec1">
      <label>환자 이름</label>
      <input type="text" id="name" name="name" placeholder="홍길동" required>
      <div class="helper">이름은 2글자 이상 입력해 주세요.</div>
      <div class="error" id="err-name">이름을 2글자 이상 입력해 주세요.</div>
    </div>

    <!-- 2) 병동/병실 (3글자 이상 입력 완료 후 다음) -->
    <div class="section" id="sec2">
      <label>병동 · 병실</label>
      <input type="text" id="ward" name="ward" placeholder="본관 5층 503호" required>
      <div class="helper">병동/병실은 3글자 이상 입력해 주세요.</div>
      <div class="error" id="err-ward">병동/병실을 3글자 이상 입력해 주세요.</div>
    </div>

    <!-- 3) 주소 (카카오 주소 찾기 완료 후 다음) -->
    <div class="section" id="sec3">
      <label>주소</label>
      <div class="row">
        <input type="text" id="address" name="address" placeholder="주소 찾기를 눌러주세요" readonly required>
        <button type="button" class="addr-btn" onclick="execDaumPostcode()">주소 찾기</button>
      </div>
      <input type="hidden" id="postcode" name="postcode">
      <div class="error" id="err-address">주소를 선택해 주세요.</div>
    </div>

    <!-- 4) 상세주소 (입력 1자 이상 OR 상세주소 없음 체크 시 다음) -->
    <div class="section" id="sec4">
      <label>상세주소</label>
      <input type="text" id="detailAddress" name="detail_address" placeholder="상세주소 입력">
      <label class="checkbox">
        <input type="checkbox" id="noDetailChk">
        상세주소 없음
      </label>
      <div class="error" id="err-detail">상세주소 입력 또는 '상세주소 없음'을 선택해 주세요.</div>
    </div>

    <!-- 5) 배송 방식 -->
    <!-- <div class="section" id="sec5">
      <label>배송 방법</label>
      <select id="delivery_type" name="delivery_type" required>
        <option value="">선택하세요</option>
        <option value="일반배송">일반배송</option>
        <option value="특급배송">특급배송</option>
      </select>
    </div> -->

    <!-- 6) 크기 -->
    <!-- <div class="section" id="sec6">
      <label>짐 크기</label>
      <select id="size" name="size" required>
        <option value="">선택하세요</option>

        <option value="중형">중형</option>
        <option value="대형">대형</option>
      </select>
    </div> -->

    <!-- 7) 무게 -->

        <option value="무거움">무거움</option>
      </select>
    </div> -->

    
    <!-- 8) 결제 방법 -->
    <div class="section" id="sec8">
      <label class="font-semibold text-gray-700 block mb-2">결제 방법</label>

      <div class="space-y-3">

        <!-- 카카오페이 -->
        <label class="flex items-center gap-3 cursor-pointer p-4 border rounded-lg hover:bg-gray-50 transition">
          <input type="radio" name="payment_method" value="kakaopay" class="hidden peer">

          <!-- 원형 UI -->
          <div class="w-5 h-5 rounded-full border-2 border-gray-300 flex items-center justify-center 
                      peer-checked:border-yellow-400">
            <div class="w-2.5 h-2.5 bg-yellow-400 rounded-full hidden peer-checked:block"></div>
          </div>

          <!-- 로고 -->
          <img src="{{ url_for('static', filename='images/kakaopay_logo.png') }}" 
              alt="KakaoPay" class="h-6">

          <!-- 텍스트 -->
          <span class="font-semibold text-gray-900">카카오페이</span>
        </label>

        <!-- 카드결제 -->
        <label class="flex items-center gap-3 cursor-pointer p-4 border rounded-lg hover:bg-gray-50 transition">
          <input type="radio" name="payment_method" value="card" class="hidden peer">

          <div class="w-5 h-5 rounded-full border-2 border-gray-300 flex items-center justify-center 
                      peer-checked:border-indigo-500">
            <div class="w-2.5 h-2.5 bg-indigo-500 rounded-full hidden peer-checked:block"></div>
          </div>

          <span class="font-semibold text-gray-900">카드결제</span>
        </label>

      </div>

      <p id="err-payment" class="text-red-600 text-sm mt-2 hidden font-semibold">
        결제 수단을 선택해주세요.
      </p>
    </div>

    <!-- 가격 표시 -->
    <div class="price-box" id="priceBox">금액: 30,000원</div>

    <!-- 제출 -->
    <button class="btn" id="submitBtn">결제하기</button>

  </form>
</div>

<script>
/* ===========================
   ✅ 단계 노출 유틸
=========================== */
function showSection(id) {
  const el = document.getElementById(id);
  if (!el.classList.contains("active")) {
    el.classList.add("active");
    setTimeout(() => el.scrollIntoView({ behavior:"smooth", block:"center" }), 50);
  }
}

function showError(id) {
  const el = document.getElementById(id);
  if (el) {
    el.classList.remove("hidden");
  }
}

function hideError(id) {
  const el = document.getElementById(id);
  if (el) {
    el.classList.add("hidden");
  }
}

/* ===========================
   ✅ 1) 이름: 2글자 이상 + blur 시 다음
=========================== */
const nameInput = document.getElementById("name");
nameInput.addEventListener("input", () => hideError("err-name"));
nameInput.addEventListener("blur", () => {
  const val = nameInput.value.trim();
  if (val.length >= 2) {
    showSection("sec2");
  } else {
    showError("err-name");
  }
});

/* ===========================
   ✅ 2) 병동/병실: 3글자 이상 + blur 시 다음
=========================== */
const wardInput = document.getElementById("ward");
wardInput.addEventListener("input", () => hideError("err-ward"));
wardInput.addEventListener("blur", () => {
  const val = wardInput.value.trim();
  if (val.length >= 3) {
    showSection("sec3");
  } else {
    showError("err-ward");
  }
});

/* ===========================
   ✅ 3) 카카오 주소검색
=========================== */
function execDaumPostcode() {
  new daum.Postcode({
    oncomplete: function(data) {
      const fullAddress = data.roadAddress || data.jibunAddress;
      const postcode = data.zonecode;

      document.getElementById("postcode").value = postcode;
      document.getElementById("address").value = fullAddress;

      hideError("err-address");
      showSection("sec4");
      document.getElementById("detailAddress").focus();
    }
  }).open();
}

/* ===========================
   ✅ 4) 상세주소 (입력 1자 이상 OR 없음 체크)
=========================== */
const detailInput = document.getElementById("detailAddress");
const noDetailChk = document.getElementById("noDetailChk");

function checkDetailAndNext() {
  const detailVal = detailInput.value.trim();
  const checked = noDetailChk.checked;

  hideError("err-detail");

  if (checked) {
    showSection("sec8");
    priceBox.style.display = "block";
    return;
  }
  if (detailVal.length >= 1) {
    showSection("sec8");
    priceBox.style.display = "block";
    return;
  }
}

detailInput.addEventListener("input", () => {
  noDetailChk.checked = false; // 입력하면 체크 해제
  checkDetailAndNext();
});

detailInput.addEventListener("blur", () => {
  checkDetailAndNext();
  if (!noDetailChk.checked && detailInput.value.trim().length < 1) {
    showError("err-detail");
  }
});

noDetailChk.addEventListener("change", () => {
  if (noDetailChk.checked) {
    detailInput.value = "";
    detailInput.disabled = true;
    detailInput.placeholder = "상세주소 없음";
    hideError("err-detail");
    showSection("sec5");
  } else {
    detailInput.disabled = false;
    detailInput.placeholder = "상세주소 입력";
  }
});

/* ===========================
   ✅ 5) 배송/크기/무게 선택 후 다음
=========================== */

/* ===========================
   ✅ 폼 제출 전 마지막 검증
=========================== */
document.getElementById("patientForm").addEventListener("submit", (e) => {
  const nameVal = nameInput.value.trim();
  const wardVal = wardInput.value.trim();
  const addrVal = document.getElementById("address").value.trim();
  const pmChecked = document.querySelector('input[name="payment_method"]:checked');
  if (!pmChecked) {
    e.preventDefault();
    showError("err-payment");
    return;
  }

  if (nameVal.length < 2) { e.preventDefault(); showError("err-name"); nameInput.focus(); return; }
  if (wardVal.length < 3) { e.preventDefault(); showError("err-ward"); wardInput.focus(); return; }
  if (!addrVal) { e.preventDefault(); showError("err-address"); return; }

  const detailVal = detailInput.value.trim();
  if (!noDetailChk.checked && detailVal.length < 1) {
    e.preventDefault();
    showError("err-detail");
    detailInput.focus();
    return;
  }
});

/* ===========================
   ✅ 결제수단 선택 시 결제 버튼 활성화
=========================== */
const paymentRadios = document.querySelectorAll('input[name="payment_method"]');
paymentRadios.forEach(r => {
  r.addEventListener("change", () => {
    submitBtn.style.display = "block"; // 결제하기 버튼 표시
    hideError("err-payment");
    submitBtn.scrollIntoView({ behavior: "smooth", block: "center" });
  });
});
</script>
<script>
  /* ===========================
   🔥 모바일 키보드 엔터 입력 대응
   Enter 키 → blur → 다음 섹션 오픈
=========================== */

// ① 이름 입력 → 엔터 시 다음(sec2)
nameInput.addEventListener("keydown", function(e){
  if (e.key === "Enter") {
    e.preventDefault();   // 폼 제출 방지
    nameInput.blur();     // 강제 blur 발생
    setTimeout(() => showSection("sec2"), 10);
  }
});

// ② 병동/병실 → 엔터 시 다음(sec3)
wardInput.addEventListener("keydown", function(e){
  if (e.key === "Enter") {
    e.preventDefault();
    wardInput.blur();
    setTimeout(() => showSection("sec3"), 10);
  }
});

// ③ 상세주소 → 엔터 시 다음(sec5)
detailInput.addEventListener("keydown", function(e){
  if (e.key === "Enter") {
    e.preventDefault();
    detailInput.blur();
    setTimeout(() => showSection("sec5"), 10);
  }
});

</script>
